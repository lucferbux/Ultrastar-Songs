<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <clipPath id="shape"><rect width="1024" height="1024"/></clipPath>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2640"/>
      <stop offset="1" stop-color="#0D0B14"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".46" r=".42">
      <stop offset="0" stop-color="#8E7BFF" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#6B54F0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6B54F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#EAE6F7"/>
      <stop offset="1" stop-color="#C9C2E6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9ADFF"/>
      <stop offset="1" stop-color="#7A63FF"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#halo)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <g fill="none" stroke="url(#wave)" stroke-linecap="round">
      <path d="M300 360a230 230 0 0 0 0 220" stroke-width="20" opacity=".9"/>
      <path d="M724 360a230 230 0 0 1 0 220" stroke-width="20" opacity=".9"/>
      <path d="M232 318a310 310 0 0 0 0 304" stroke-width="16" opacity=".45"/>
      <path d="M792 318a310 310 0 0 1 0 304" stroke-width="16" opacity=".45"/>
    </g>
    <g filter="url(#lift)">
      <rect x="407" y="214" width="210" height="330" rx="105" fill="url(#silver)"/>
      <path d="M447 262v196" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".85"/>
      <path d="M352 462a160 160 0 0 0 320 0" fill="none" stroke="url(#silver)" stroke-width="30" stroke-linecap="round"/>
      <rect x="497" y="622" width="30" height="104" rx="15" fill="url(#silver)"/>
      <rect x="412" y="722" width="200" height="34" rx="17" fill="url(#silver)"/>
    </g>
  </g>
